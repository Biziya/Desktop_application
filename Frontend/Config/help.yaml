# Help window text: opened with the ? button at the top right of every page, or with F1.
# One entry per sidebar page; "page" must match the sidebar title exactly.
# "important" (optional): what must be done first on that page; shown at the top, in a highlighted box.
# "items": the buttons and fields on that page, most important first, and what they do.
# Keep it short: one plain sentence each ("does" at most 90 characters, "purpose" at most 100).
# Changes take effect after a restart.
pages:
  - page: Core Information
    purpose: Pick the drillhole and check that this laptop is ready to measure.
    important:
      - Open GammaGuard and connect the SPP first.
      - Press Save & Continue before you can measure.
    items:
      - control: Drillhole
        does: Type part of the ID, then pick it. Drillholes you already measured come first.
      - control: Save & Continue
        does: Saves your choice and opens the Measurement page.
      - control: Device Status
        does: Green means ready. Red or amber means something needs fixing.
      - control: Retry
        does: Checks the device or database again.
      - control: Select Database / Change Database
        does: Pick the GammaGuard database yourself if the app can't find it.
      - control: Operator / Notes
        does: Your name and any remarks. Saved with every reading.
      - control: Project / Campaign
        does: Filled in for you from the drillhole.

  - page: Measurement
    purpose: Measure the drillhole one interval at a time.
    important:
      - Press Start, then right-click anywhere to capture each interval.
      - Readings stay on this laptop until you export and upload them.
    items:
      - control: Start / Stop
        does: Turns measuring on or off. While on, each right-click captures one interval.
      - control: Starting Depth (m)
        does: Where the first interval starts. The next one follows on its own.
      - control: Step (cm)
        does: How long each interval is.
      - control: Capture Countdown
        does: Time left in the current capture. Click it to change the length (2 to 10 s).
      - control: Export CSV
        does: Saves the table as a file you can send on the Upload Data page.
      - control: Threshold (CPS)
        does: Plays an alarm when a reading goes above this number. Leave empty for no alarm.
      - control: Bell
        does: Shows the alarm state. Click to mute or unmute.
      - control: Delete (✕)
        does: Removes one row, after you confirm.
      - control: New Measurement
        does: Clears the table for a new run on the same drillhole. Saved data is kept.

  - page: Monitoring
    purpose: Live readings from every detector connected in GammaGuard.
    important:
      - GammaGuard must be running, with a database picked on Core Information.
    items:
      - control: State
        does: Live, Stale (nothing for 5 s), No data or Disconnected.
      - control: Open Core Information
        does: Takes you to the page where you pick the database.
      - control: Take sample
        does: Skips the next reading, then averages the 5 after it.
      - control: Response
        does: Detector response time. Samples need 1 s; you'll see a warning otherwise.
      - control: Detector row
        does: Click a row for its details and raw values.
      - control: Recent readings
        does: Click the arrow to show or hide the latest readings.

  - page: Upload Data
    purpose: Send an exported CSV to the central database.
    important:
      - This is the only way readings reach the central database.
      - You need to be online (green dot in the sidebar).
    items:
      - control: Import CSV
        does: Opens a CSV saved from the Measurement page. The file is not changed.
      - control: Upload Data
        does: Sends the rows to the central database. Sending a file twice stores it once.
      - control: Delete (✕)
        does: Drops a row before you upload it.

  - page: Data Viewer
    purpose: See what has been uploaded to the central database, by drillhole.
    important:
      - Only uploaded readings show here.
    items:
      - control: Drillhole
        does: Type part of the ID, then pick it. Only drillholes with uploads are listed.
      - control: Table
        does: All uploaded readings for that drillhole, by depth.
      - control: Refresh
        does: Loads the latest data again.
      - control: Project / Campaign
        does: Project and campaign of the chosen drillhole.
