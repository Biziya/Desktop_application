# Application metadata: the single source of truth for the name and version.
# - Frontend.csproj reads it at build time (assembly version, product name).
# - build-installer.ps1 reads it for the Velopack package (id, title, version).
# - The app reads it at start-up (window title, sidebar version, Help panel).
# Change the version here only; it must be SemVer (for example 1.0.1 or 1.1.0-beta.1):
#   major = incompatible change (data, CSV or API), minor = new feature or page, patch = fixes only.
application:
  # Velopack package id and install folder. Never change it after a release: installed copies only update from a
  # feed with the same id. It is internal and not shown to users (the name below is).
  id: "CT007.MeasurementStudio"
  name: "SPP CT007"
  version: "1.1.0"
  description: "SPP CT007 measurement desktop application"
