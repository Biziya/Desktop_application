# Builds the solution and runs the test harness (Tests/) on Windows. Never deploys.
name: Tests

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]
    paths-ignore: ['**/*.md', 'Images/**']
  workflow_dispatch:
    inputs:
      categories:
        description: 'Opt-in categories (Timing, Sql, E2E)'
        type: string
        default: 'Timing'

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Build and test (Windows)
    runs-on: windows-latest   # WPF and the WinRT Bluetooth API need Windows
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check for committed passwords
        shell: bash
        run: sh tools/check-secrets.sh --all

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build CT007.slnx -c Debug

      - name: Run tests
        shell: pwsh
        env:
          CATEGORIES: ${{ inputs.categories || 'Timing' }}
        run: dotnet run --project Tests/CT007.Tests.csproj --no-build -- "--include=$env:CATEGORIES" --results=test-results.csv

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.csv
          if-no-files-found: warn
          retention-days: 14
